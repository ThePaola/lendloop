services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.46.6
    ports: ["5678:5678"]
    environment:
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      LENDLOOP_CONVEX_TO_N8N_SECRET: ${CONVEX_TO_N8N_SECRET}
      LENDLOOP_N8N_TO_CONVEX_SECRET: ${N8N_TO_CONVEX_SECRET}
      LENDLOOP_CONVEX_SITE_URL: ${CONVEX_SITE_URL_FOR_N8N}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

volumes:
  n8n_data: